<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="png" href="../images/Favicon.png">
    <title>Forgot Password | CyberSheild_Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left,
                    rgba(37, 99, 235, .15),
                    transparent 35%),
                radial-gradient(circle at bottom right,
                    rgba(124, 58, 237, .15),
                    transparent 35%),
                #050816;

            color: white;
        }

        .auth-card {
            width: 420px;
            background: rgba(18, 22, 35, .9);

            border: 1px solid rgba(255, 255, 255, .08);

            border-radius: 24px;

            padding: 40px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 40px rgba(0, 0, 0, .4);
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .auth-card h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #d1d5db;
        }

        .input-group input {
            width: 100%;

            padding: 14px 16px;

            background: transparent;

            border: 1px solid #2b3554;

            border-radius: 14px;

            color: white;

            outline: none;

            transition: .3s;
        }

        .input-group input:focus {
            border-color: #4f46e5;
            box-shadow:
                0 0 0 3px rgba(79, 70, 229, .15);
        }

        .auth-btn {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 16px;

            cursor: pointer;

            color: white;

            font-weight: 600;

            font-size: 15px;

            background:
                linear-gradient(90deg,
                    #2563eb,
                    #7c3aed);

            transition: .3s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
            margin-top: 18px;
        }

        .back-link a {
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <div class="logo">🛡️</div>

        <h2>Forgot Password</h2>

        <p>
            Enter your email and we'll send a reset link.
        </p>

        <div class="input-group">

            <label>Email</label>

            <input id="email" type="email" placeholder="you@example.com">

        </div>

        <button class="auth-btn" id="sendBtn">

            Send Reset Link

        </button>

        <p id="message"></p>

        <div class="back-link">
            <a href="login.html">
                Back to Login
            </a>
        </div>

    </div>

    <script>

        document
            .getElementById("sendBtn")
            .addEventListener("click", async () => {

                const email =
                    document.getElementById("email").value.trim();

                const btn =
                    document.getElementById("sendBtn");

                const msg =
                    document.getElementById("message");

                if (!email) {
                    msg.style.color = "#ef4444";
                    msg.textContent = "Please enter your email.";
                    return;
                }

                btn.disabled = true;
                btn.innerText = "Sending...";

                msg.textContent = "";

                try {

                    console.log("Sending forgot-password request...");
                    console.log("Email:", email);

                    const res = await fetch(
                        "http://localhost:5001/api/forgot-password",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ email })
                        }
                    );

                    console.log("Response status:", res.status);

                    const data = await res.json();

                    console.log("Backend response:", data);

                    if (res.ok) {

                        msg.style.color = "#22c55e";
                        msg.textContent =
                            data.message || "Reset link sent successfully.";

                    } else {

                        msg.style.color = "#ef4444";
                        msg.textContent =
                            data.message || "Something went wrong.";

                    }

                } catch (error) {

                    console.error("Forgot password error:", error);

                    msg.style.color = "#ef4444";
                    msg.textContent =
                        "Unable to connect to the server. Please try again.";

                } finally {

                    btn.disabled = false;
                    btn.innerText = "Send Reset Link";

                }

            });

    </script>

</body>

</html>
