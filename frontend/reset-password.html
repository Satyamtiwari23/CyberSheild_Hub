<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | CyberShield Hub</title>

  <link rel="icon" type="image/png" href="images/Favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at top left,
          rgba(37, 99, 235, .15),
          transparent 35%),
        radial-gradient(circle at bottom right,
          rgba(124, 58, 237, .15),
          transparent 35%),
        #050816;

      color: white;
    }

    .auth-card {
      width: 420px;
      background: rgba(18, 22, 35, .9);

      border: 1px solid rgba(255, 255, 255, .08);

      border-radius: 24px;

      padding: 40px;

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 40px rgba(0, 0, 0, .4);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 15px;
    }

    .auth-card h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .auth-card p {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
    }

    .input-group input {
      width: 100%;

      padding: 14px 16px;

      background: transparent;

      border: 1px solid #2b3554;

      border-radius: 14px;

      color: white;

      outline: none;

      transition: .3s;
    }

    .input-group input:focus {
      border-color: #4f46e5;
      box-shadow:
        0 0 0 3px rgba(79, 70, 229, .15);
    }

    /* ===== PASSWORD TOGGLE ===== */

.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  padding-right: 48px;
}

.password-toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);

  width: 30px;
  height: 30px;

  padding: 0;
  border: none;
  outline: none;

  background: transparent;

  color: #9ca3af;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 10;
}

.password-toggle:hover {
  color: #ffffff;
}

.password-toggle:focus,
.password-toggle:focus-visible {
  outline: none;
  box-shadow: none;
}

.eye-icon {
  width: 20px;
  height: 20px;

  display: block;
}

.eye-open {
  display: none;
}

.password-toggle.showing .eye-closed {
  display: none;
}

.password-toggle.showing .eye-open {
  display: block;
}

    .auth-btn {
      width: 100%;

      border: none;

      padding: 14px;

      border-radius: 16px;

      cursor: pointer;

      color: white;

      font-weight: 600;

      font-size: 15px;

      background:
        linear-gradient(90deg,
          #2563eb,
          #7c3aed);

      transition: .3s;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
    }

    .back-link a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <div class="logo">🔒</div>

    <h2>Reset Password</h2>

    <p>
      Create a new password for your CyberShield Hub account.
    </p>

    <div class="input-group">

      <label>Verification OTP</label>

      <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP">

    </div>

    <div class="input-group">

      <label>New Password</label>

      <div class="password-wrapper">

  <input
    id="newPassword"
    type="password"
    placeholder="Enter new password"
  >

  <button
    type="button"
    class="password-toggle"
    onclick="togglePassword('newPassword', this)"
    aria-label="Show password"
  >

    <!-- CLOSED EYE -->
    <svg
      class="eye-icon eye-closed"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3 12C3 12 6.5 18 12 18C17.5 18 21 12 21 12"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M6 16L4.5 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M18 16L19.5 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>

    <!-- OPEN EYE -->
    <svg
      class="eye-icon eye-open"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3 12C3 12 6.5 6 12 6C17.5 6 21 12 21 12C21 12 17.5 18 12 18C6.5 18 3 12 3 12Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <circle
        cx="12"
        cy="12"
        r="2.5"
        fill="currentColor"
      />
    </svg>

  </button>

</div>

    </div>

    <div class="input-group">

      <label>Confirm Password</label>

      <div class="password-wrapper">

  <input
    id="confirmPassword"
    type="password"
    placeholder="Confirm password"
  >

  <button
    type="button"
    class="password-toggle"
    onclick="togglePassword('confirmPassword', this)"
    aria-label="Show password"
  >

    <!-- CLOSED EYE -->
    <svg
      class="eye-icon eye-closed"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3 12C3 12 6.5 18 12 18C17.5 18 21 12 21 12"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M6 16L4.5 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M18 16L19.5 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>

    <!-- OPEN EYE -->
    <svg
      class="eye-icon eye-open"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3 12C3 12 6.5 6 12 6C17.5 6 21 12 21 12C21 12 17.5 18 12 18C6.5 18 3 12 3 12Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <circle
        cx="12"
        cy="12"
        r="2.5"
        fill="currentColor"
      />
    </svg>

  </button>

</div>

    </div>

    <button class="auth-btn" id="resetBtn">

      Reset Password

    </button>

    <div class="back-link">
      <a href="login.html">
        Back to Login
      </a>
    </div>

  </div>

  <script>

    const token =
      new URLSearchParams(
        window.location.search
      ).get("token");

    if (!token) {
      alert("Invalid or missing reset token.");
      window.location.href = "login.html";
    }


    function togglePassword(inputId, button) {

  const input = document.getElementById(inputId);

  if (input.type === "password") {

    // Show password
    input.type = "text";

    button.classList.add("showing");

    button.setAttribute(
      "aria-label",
      "Hide password"
    );

  } else {

    // Hide password
    input.type = "password";

    button.classList.remove("showing");

    button.setAttribute(
      "aria-label",
      "Show password"
    );
  }
}

    document
      .getElementById("resetBtn")
      .addEventListener("click", async () => {

        const password =
          document.getElementById(
            "newPassword"
          ).value;

        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;

        const otp =
          document.getElementById("otp").value.trim();

        if (!/^\d{6}$/.test(otp)) {
          alert("Please enter the 6-digit OTP.");
          return;
        }
        if (password !== confirmPassword) {
          alert("Passwords do not match");
          return;
        }

        if (password.length < 6) {
          alert(
            "Password must be at least 6 characters"
          );
          return;
        }

        const res =
          await fetch(
            "https://cybershield-hub-nu.vercel.app/api/reset-password",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                token,
                otp,
                password
              })
            }
          );

        const data =
          await res.json();

        alert(data.message);

        if (
          data.message ===
          "Password reset successful"
        ) {
          window.location.href =
            "login.html";
        }

      });

  </script>

</body>

</html>
