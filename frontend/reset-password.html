<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | CyberShield Hub</title>

  <link rel="icon" href="../images/Favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at top left,
          rgba(37, 99, 235, .15),
          transparent 35%),
        radial-gradient(circle at bottom right,
          rgba(124, 58, 237, .15),
          transparent 35%),
        #050816;

      color: white;
    }

    .auth-card {
      width: 420px;
      background: rgba(18, 22, 35, .9);

      border: 1px solid rgba(255, 255, 255, .08);

      border-radius: 24px;

      padding: 40px;

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 40px rgba(0, 0, 0, .4);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 15px;
    }

    .auth-card h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .auth-card p {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
    }

    .input-group input {
      width: 100%;

      padding: 14px 16px;

      background: transparent;

      border: 1px solid #2b3554;

      border-radius: 14px;

      color: white;

      outline: none;

      transition: .3s;
    }

    .input-group input:focus {
      border-color: #4f46e5;
      box-shadow:
        0 0 0 3px rgba(79, 70, 229, .15);
    }

    .auth-btn {
      width: 100%;

      border: none;

      padding: 14px;

      border-radius: 16px;

      cursor: pointer;

      color: white;

      font-weight: 600;

      font-size: 15px;

      background:
        linear-gradient(90deg,
          #2563eb,
          #7c3aed);

      transition: .3s;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
    }

    .back-link a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <div class="logo">🔒</div>

    <h2>Reset Password</h2>

    <p>
      Create a new password for your CyberShield Hub account.
    </p>

    <div class="input-group">

      <label>Verification OTP</label>

      <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP">

    </div>

    <div class="input-group">

      <label>New Password</label>

      <input id="newPassword" type="password" placeholder="Enter new password">

    </div>

    <div class="input-group">

      <label>Confirm Password</label>

      <input id="confirmPassword" type="password" placeholder="Confirm password">

    </div>

    <button class="auth-btn" id="resetBtn">

      Reset Password

    </button>

    <div class="back-link">
      <a href="login.html">
        Back to Login
      </a>
    </div>

  </div>

  <script>

    const token =
      new URLSearchParams(
        window.location.search
      ).get("token");

    if (!token) {
      alert("Invalid or missing reset token.");
      window.location.href = "login.html";
    }

    document
      .getElementById("resetBtn")
      .addEventListener("click", async () => {

        const password =
          document.getElementById(
            "newPassword"
          ).value;

        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;

        const otp =
          document.getElementById("otp").value.trim();

        if (!/^\d{6}$/.test(otp)) {
          alert("Please enter the 6-digit OTP.");
          return;
        }
        if (password !== confirmPassword) {
          alert("Passwords do not match");
          return;
        }

        if (password.length < 6) {
          alert(
            "Password must be at least 6 characters"
          );
          return;
        }

        const res =
          await fetch(
            "https://cybersheild-hub.onrender.com/api/reset-password",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                token,
                otp,
                password
              })
            }
          );

        const data =
          await res.json();

        alert(data.message);

        if (
          data.message ===
          "Password reset successful"
        ) {
          window.location.href =
            "login.html";
        }

      });

  </script>

</body>

</html>
