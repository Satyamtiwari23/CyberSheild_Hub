<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield AI Assistant</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Favicon.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #020617;
            --card: #020617;
            --card-border: rgba(51, 65, 85, 0.9);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;

            background:
                radial-gradient(circle at 0% 0%,
                    rgba(59, 130, 246, .20),
                    transparent 60%),

                radial-gradient(circle at 100% 100%,
                    rgba(34, 197, 94, .15),
                    transparent 55%),

                linear-gradient(145deg,
                    var(--bg) 0%,
                    #020617 100%);

            background-attachment: fixed;

            color: var(--text);

            min-height: 100vh;
        }

        .light-mode {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #020617;
            --muted: #475569;
            --card-border: #e2e8f0;
        }

        body.light-mode {

            background:
                radial-gradient(circle at 0% 0%,
                    rgba(59, 130, 246, .08),
                    transparent 60%),

                radial-gradient(circle at 100% 100%,
                    rgba(34, 197, 94, .06),
                    transparent 55%),

                #f8fafc;

            color: #0f172a;
        }

        /* SIDEBAR */

        body.light-mode .sidebar {

            background: #ffffff;

            border-right: 1px solid #dbe4f0;
        }

        body.light-mode .logo {

            color: #0f172a;
        }

        body.light-mode .history-item {

            background: #f8fafc;

            color: #0f172a;

            border: 1px solid #e2e8f0;
        }

        body.light-mode .history-item:hover {

            background: #eff6ff;

            border-color: #3b82f6;
        }

        /* TOPBAR */

        body.light-mode .topbar {

            background: #ffffff;

            color: #0f172a;

            border-bottom: 1px solid #dbe4f0;
        }

        body.light-mode .topbar h2 {

            color: #0f172a;
        }

        /* CHAT AREA */

        body.light-mode .chat-area {

            background: transparent;
        }

        /* USER MESSAGE */

        body.light-mode .user-message {

            color: white;
        }

        /* AI MESSAGE */

        body.light-mode .ai-message {

            background: #ffffff;

            color: #0f172a;

            border: 1px solid #dbe4f0;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, .06);
        }

        /* THINKING BOX */

        body.light-mode .thinking-box {

            background: #ffffff;

            color: #0f172a;

            border: 1px solid #dbe4f0;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, .06);
        }

        /* INPUT BAR */

        body.light-mode .input-area {

            background: #ffffff;

            border-top: 1px solid #dbe4f0;
        }

        body.light-mode .input-area input {

            background: #f8fafc;

            color: #0f172a;

            border: 1px solid #dbe4f0;
        }

        body.light-mode .input-area input::placeholder {

            color: #64748b;
        }

        /* THEME BUTTON */

        body.light-mode .theme-btn {

            background: #f3f4f6;

            color: #0f172a;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* ==========================
   SIDEBAR
========================== */

        .sidebar {
            width: 280px;

            background: rgba(2, 6, 23, .95);

            backdrop-filter: blur(15px);

            border-right: 1px solid rgba(59, 130, 246, .25);

            color: var(--text);

            padding: 24px;

            display: flex;
            flex-direction: column;
        }

        .logo {

            font-size: 28px;

            font-weight: 700;

            color: white;

            margin-bottom: 25px;
        }

        .new-chat {

            background:
                linear-gradient(135deg,
                    #3b82f6,
                    #2563eb);

            border: none;

            border-radius: 14px;

            padding: 14px;

            color: white;

            font-weight: 600;

            cursor: pointer;

            margin-bottom: 20px;
        }

        #history {
            overflow-y: auto;
        }

        .history-item {

            background: rgba(255, 255, 255, .05);

            color: var(--text);

            border: 1px solid rgba(255, 255, 255, .05);

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 10px;

            transition: .3s;
        }

        .history-item:hover {

            border-color: #3b82f6;

            background: rgba(59, 130, 246, .15);

            transform: translateY(-2px);
        }

        /* ==========================
   CHAT AREA
========================== */

        .chat-area {

            flex: 1;

            display: flex;

            flex-direction: column;

            background: transparent;
        }

        .topbar {

            height: 70px;

            background: rgba(2, 6, 23, .75);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(59, 130, 246, .25);

            color: var(--text);

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 25px;
        }

        .topbar h2 {
            font-size: 18px;
        }

        .theme-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #f3f4f6;
            cursor: pointer;
            font-size: 20px;
            transition: .3s;
        }

        .theme-btn:hover {
            transform: scale(1.05);
        }

        /* ==========================
   MESSAGES
========================== */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .user-message {
            align-self: flex-end;

            background: linear-gradient(135deg,
                    #0d6efd,
                    #38bdf8);

            color: white;

            padding: 16px 20px;

            border-radius: 20px;

            max-width: 70%;

            line-height: 1.6;
        }

        .ai-message {

            align-self: flex-start;

            width: 95%;

            background: rgba(2, 6, 23, .95);

            border: 1px solid rgba(59, 130, 246, .25);

            color: var(--text);

            padding: 25px;

            border-radius: 24px;

            line-height: 1.9;

            box-shadow:
                0 0 25px rgba(59, 130, 246, .12);
        }

        .correct {
            background: #dcfce7;
            border-left: 5px solid #16a34a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .wrong {
            background: #fee2e2;
            border-left: 5px solid #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* ==========================
   INPUT AREA
========================== */

        .input-area {

            display: flex;

            gap: 12px;

            padding: 18px;

            background: rgba(2, 6, 23, .8);

            backdrop-filter: blur(15px);

            border-top: 1px solid rgba(59, 130, 246, .25);
        }

        .input-area input {

            flex: 1;

            padding: 16px 20px;

            border-radius: 30px;

            border: 1px solid rgba(59, 130, 246, .25);

            background: rgba(255, 255, 255, .05);

            color: white;

            outline: none;
        }

        .input-area button,
        .input-area label {

            width: 52px;
            height: 52px;

            border: none;

            border-radius: 50%;

            background: #0d6efd;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 18px;
        }

        /* ==========================
   TYPING ANIMATION
========================== */

        .typing {
            display: flex;
            gap: 6px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0d6efd;
            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        /* ==========================
   DARK MODE
========================== */

        .dark {
            background: #0f172a;
            color: white;
        }

        .dark .sidebar {
            background: #111827;
            color: white;
            border-right: 1px solid #1f2937;
        }

        .dark .history-item {
            background: #1f2937;
            color: white;
        }

        .dark .history-item:hover {
            background: #374151;
        }

        .dark .chat-area {
            background: #0f172a;
        }

        .dark .topbar {
            background: #111827;
            color: white;
            border-bottom: 1px solid #1f2937;
        }

        .dark .theme-btn {
            background: #1f2937;
            color: white;
        }

        .dark .ai-message {
            background: #1f2937;
            color: white;
        }

        .dark .input-area {
            background: #111827;
            border-top: 1px solid #1f2937;
        }

        .dark .input-area input {
            background: #1f2937;
            color: white;
            border: none;
        }

        .thinking-box {

            width: 260px;

            background: #1f2937;

            color: white;

            padding: 18px;

            border-radius: 18px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .25);

        }

        .thinking-header {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 12px;

        }

        .loader-ring {

            width: 18px;
            height: 18px;

            border: 3px solid #444;
            border-top: 3px solid #3b82f6;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        .ai-message h1,
        .ai-message h2,
        .ai-message h3 {
            margin: 20px 0 10px;
            color: #60a5fa;
        }

        .ai-message ul {
            margin-left: 25px;
            margin-top: 10px;
        }

        .ai-message li {
            margin: 8px 0;
        }

        .ai-message code {

            background: #111827;

            padding: 3px 6px;

            border-radius: 5px;

            color: #38bdf8;
        }

        .ai-message pre {

            background: #111827;

            padding: 15px;

            border-radius: 10px;

            overflow: auto;

            margin: 15px 0;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .typing-loader {

            display: flex;
            gap: 6px;
        }

        .typing-loader span {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #3b82f6;

            animation: bounce 1.2s infinite;
        }

        .typing-loader span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing-loader span:nth-child(3) {
            animation-delay: .4s;
        }

        #scrollBottomBtn {

            position: absolute;

            bottom: 90px;

            right: 30;

            width: 50px;

            height: 50px;

            border: none;

            border-radius: 50%;

            background: rgba(30,
                    136,
                    255,
                    .85);

            color: white;

            font-size: 24px;

            cursor: pointer;

            display: none;

            z-index: 999;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, .25);

            transition: .3s;
            backdrop-filter: blur(10px);
        }

        #scrollBottomBtn:hover {

            transform: scale(1.1);

        }
    </style>
</head>

<body>

    <div class="app">

        <!-- Sidebar -->

        <div class="sidebar">

            <div class="logo">
                🛡️ AI Cyber Assistant
            </div>

            <button class="new-chat" onclick="newChat()">
                + New Chat
            </button>

            <div id="history">
            </div>

        </div>

        <!-- Main Chat -->

        <div class="chat-area">

            <div class="topbar">

                <h2>🛡️ AI Cyber Assistant</h2>

                <button id="themeBtn" class="theme-btn">
                    🌙
                </button>

            </div>

            <div id="messages">

                <div class="welcome">
                </div>

            </div>

            <button id="scrollBottomBtn">
                ⬇
            </button>
            <!-- Bottom Input -->

            <div class="input-area">

                <label for="imageInput">
                    <i class="fas fa-paperclip"></i>
                </label>

                <input type="file" id="imageInput" accept="image/*" hidden>

                <button onclick="startVoice()">
                    <i class="fas fa-microphone"></i>
                </button>

                <input type="text" id="topic" placeholder="Ask anything...">

                <button onclick="generateAnswer()">
                    <i class="fas fa-paper-plane"></i>
                </button>

            </div>

        </div>

    </div>

    <script>
        let chats =
            JSON.parse(
                localStorage.getItem("history")
            ) || [];

        const messages = [

            "🧠 Analyzing your question...",
            "📚 Searching knowledge...",
            "⚡ Building explanation...",
            "💡 Generating examples...",
            "🎯 Preparing answer..."

        ];


        async function generateAnswer() {

            const topic =
                document.getElementById("topic").value;

            if (!topic) return;

            addUserMessage(topic);

            document.getElementById("topic").value = "";

            showThinking();

            try {

                const startTime = Date.now();

                const response = await fetch("/generate", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        topic: topic
                    })

                });

                const data = await response.json();

                const elapsed =
                    Date.now() - startTime;

                const minimumTime = 5000;

                if (elapsed < minimumTime) {

                    await new Promise(resolve =>
                        setTimeout(
                            resolve,
                            minimumTime - elapsed
                        )
                    );

                }

                removeThinking();

                addAIMessage(data.answer);

                saveHistory(topic);

            }

            catch (error) {

                removeThinking();

                addAIMessage(
                    "❌ Error connecting to AI"
                );

            }

        }

        function addUserMessage(text) {

            const div =
                document.createElement("div");

            div.className =
                "user-message";

            div.innerText =
                text;

            document
                .getElementById("messages")
                .appendChild(div);

        }

        function addAIMessage(text) {

            const div =
                document.createElement("div");

            div.className =
                "ai-message";

            document
                .getElementById("messages")
                .appendChild(div);

            let i = 0;
            const messages =
                document.getElementById("messages");
            const interval =
                setInterval(() => {

                    div.innerHTML =
                        marked.parse(
                            text.substring(0, i)
                        );

                    i++;

                    if (
                        messages.scrollHeight -
                        messages.scrollTop -
                        messages.clientHeight
                        < 50
                    ) {

                        messages.scrollTop =
                            messages.scrollHeight;

                    }

                    if (i > text.length) {
                        clearInterval(interval);
                    }

                }, 1);

        }

        function formatResponse(text) {

            text =
                text.replaceAll(
                    "Correct:",
                    `<div class="correct">
             ✅ Correct:
             `
                );

            text =
                text.replaceAll(
                    "Incorrect:",
                    `<div class="wrong">
             ❌ Incorrect:
             `
                );

            return text;

        }

        function saveHistory(topic) {

            chats.push(topic);

            localStorage.setItem(
                "history",
                JSON.stringify(chats)
            );

        }

        function loadHistory() {

            const history =
                document.getElementById(
                    "history"
                );

            history.innerHTML = "";

            chats =
                JSON.parse(
                    localStorage.getItem(
                        "history"
                    )
                ) || [];

            chats.forEach(chat => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "history-item";

                div.innerText =
                    chat;

                div.onclick = () => {

                    document.getElementById(
                        "topic"
                    ).value = chat;

                };

                history.appendChild(div);

            });

        }

        loadHistory();

        /* Theme */
        window.addEventListener("DOMContentLoaded", () => {

            const themeBtn =
                document.getElementById("themeBtn");

            const savedTheme =
                localStorage.getItem("theme");

            if (savedTheme === "light") {

                document.body.classList.add("light-mode");
                themeBtn.innerHTML = "🌙";

            }
            else {

                themeBtn.innerHTML = "☀️";

            }

        });
        /* Voice */

        function startVoice() {

            const recognition =
                new webkitSpeechRecognition();

            recognition.start();

            recognition.onresult =
                function (event) {
                    document.getElementById("topic").value =event.results[0][0].transcript;
                }

        }

        let statusInterval;

        function showThinking() {

            const div =
                document.createElement("div");

            div.className =
                "thinking-box";

            div.id =
                "thinking";

            div.innerHTML = `

        <div class="thinking-header">

            <div class="loader-ring"></div>

            <span id="thinking-text">
                🧠 Analyzing your question...
            </span>

        </div>

    `;

            document
                .getElementById("messages")
                .appendChild(div);

            scrollToBottom();

            let index = 0;

            statusInterval =
                setInterval(() => {

                    index++;

                    document.getElementById(
                        "thinking-text"
                    ).innerText =
                        messages[index % messages.length];

                }, 1500);

        }

        function removeThinking() {

            clearInterval(statusInterval);

            const thinking =
                document.getElementById("thinking");

            if (thinking) {
                thinking.remove();
            }

        }

        function scrollToBottom() {

            const messagesBox =
                document.getElementById("messages");

            messagesBox.scrollTo({
                top: messagesBox.scrollHeight,
                behavior: "smooth"
            });

        }


        function newChat() {
            document.getElementById("messages").innerHTML = "";

        }



        window.addEventListener("DOMContentLoaded",() => {
            const scrollBtn =document.getElementById( "scrollBottomBtn");
                loadHistory();

                const themeBtn = document.getElementById("themeBtn");

                themeBtn.addEventListener("click",() => {
                        document.body.classList.toggle("light-mode");

                        const isLight = document.body.classList.contains("light-mode");

                        localStorage.setItem("theme",isLight? "light": "dark");

                        themeBtn.addEventListener("click", () => {

                            document.body.classList.toggle("light-mode");

                            const isLight = document.body.classList.contains("light-mode");

                            localStorage.setItem("theme",isLight ? "light" : "dark");

                            themeBtn.innerHTML = isLight ? "🌙" : "☀️";

                        });
                    }
                );

                window.addEventListener("keydown", (e) => {

                    if (e.key === "Enter") {

                        console.log("ENTER");

                        generateAnswer();

                    }

                });

            }
        );






    </script>

</body>

</html>
